name: build-image

# The image for the rbitcoin-node app: rbitcoin-node built from a pinned
# upstream commit as a static musl binary, on Alpine (docker/Dockerfile).
# Published on a tag of the form v<rbitcoin version>-<app patch>, such as
# v0.8.99-3, as ghcr.io/coreyphillips/rbitcoin-umbrel:0.8.99-3. The rbitcoin
# version is the workspace version in the pinned commit's Cargo.toml. The
# app patch lets a packaging fix, or a later commit with the same workspace
# version, ship as 0.8.99-4; a new workspace version starts the patch over
# (0.9.0-1). The tag's version is also the app's `version` in
# umbrel-app.yml, so check-release's tag-equals-version rule holds.
#
# Releases up to 0.8.99-2 were published from coreyphillips/beignet-umbrel
# as ghcr.io/coreyphillips/rbitcoin, on rbitcoin-v* tags there, for the
# beignet-rbitcoin app. Those images stay where they are: installs of that
# app pull them by digest.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/coreyphillips/rbitcoin-umbrel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          # The Dockerfile is the one place the rbitcoin version, the commit
          # it is built from, the binary's checksum and the base images are
          # pinned; read them from there so the tag cannot claim a version
          # the binary is not.
          RB=$(sed -nE 's/^ARG RBITCOIN_VERSION=(.+)$/\1/p' docker/Dockerfile)
          COMMIT=$(sed -nE 's/^ARG RBITCOIN_COMMIT=([0-9a-f]{40})$/\1/p' docker/Dockerfile)
          SHA=$(sed -nE 's/^ARG RBITCOIN_NODE_SHA256=([0-9a-f]{64})$/\1/p' docker/Dockerfile)
          RUST=$(sed -nE 's/^ARG RUST_IMAGE=(.+)$/\1/p' docker/Dockerfile)
          ALPINE=$(sed -nE 's/^ARG ALPINE_IMAGE=(.+)$/\1/p' docker/Dockerfile)
          if [ -z "$RB" ] || [ -z "$COMMIT" ] || [ -z "$SHA" ]; then
            echo "::error::docker/Dockerfile must pin RBITCOIN_VERSION, a 40-hex RBITCOIN_COMMIT and a 64-hex RBITCOIN_NODE_SHA256"; exit 1
          fi
          case "$RUST" in
            rust:*@sha256:*) ;;
            *) echo "::error::docker/Dockerfile must pin RUST_IMAGE to a tag and digest, got '$RUST'"; exit 1 ;;
          esac
          case "$ALPINE" in
            alpine:*@sha256:*) ;;
            *) echo "::error::docker/Dockerfile must pin ALPINE_IMAGE to a tag and digest, got '$ALPINE'"; exit 1 ;;
          esac
          # The tag must be exactly the pinned release plus a numeric app
          # patch: v0.8.0 or v0.8.0-beta would publish a
          # version the release-notes check later refuses, and :latest with it.
          if [ "$VERSION" != "dev" ] && ! printf '%s\n' "$VERSION" | grep -qE "^$(printf '%s' "$RB" | sed 's/\./\\./g')-[0-9]+$"; then
            echo "::error::tag $GITHUB_REF_NAME must be v$RB-<app patch>, the release the Dockerfile pins plus a number (for example v$RB-1); got $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rbitcoin=$RB" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 carries a stub, not the node (see the Dockerfile): the
      # app then installs on a Raspberry Pi Umbrel and its page says why the
      # node is not running, instead of the pull failing with no explanation.
      # The source label links the package to this repository on GHCR, so the
      # package shows up under it and takes its access permissions. Whether
      # the first publish comes out public is up to GHCR; check-release's
      # anonymous digest fetch says if it did not (README.md, Releasing).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/coreyphillips/rbitcoin-umbrel
            org.opencontainers.image.description=rbitcoin ${{ steps.meta.outputs.rbitcoin }} (rbitcoin-org/rbitcoin@${{ steps.meta.outputs.commit }}) for the rbitcoin-node Umbrel app
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
