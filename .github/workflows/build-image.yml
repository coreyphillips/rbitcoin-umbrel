name: build-image

# The image for the rbitcoin-node app: rbitcoin-node built from a pinned
# upstream commit as a static musl binary for linux/amd64 and linux/arm64,
# on Alpine (docker/Dockerfile). Published on a tag of the form
# v<rbitcoin version>-<app patch>, such as v0.9.99-2, as
# ghcr.io/coreyphillips/rbitcoin-umbrel:0.9.99-2. The rbitcoin version is the
# workspace version in the pinned commit's Cargo.toml. The app patch lets a
# packaging fix, or a later commit with the same workspace version, ship as
# 0.9.99-3; a new workspace version starts the patch over (0.10.0-1). The
# tag's version is also the app's `version` in umbrel-app.yml, so
# check-release's tag-equals-version rule holds.
#
# Each platform builds on a native runner, as upstream builds its own x86_64
# and aarch64 releases: a Rust release build under QEMU takes hours where a
# native one takes minutes. Each pushes its image by digest alone, and the
# merge job then names both in one multi-platform index under the tags.
# A manual run publishes the tag `dev` only; `latest` moves with release tags.
#
# Releases up to 0.8.99-2 were published from coreyphillips/beignet-umbrel
# as ghcr.io/coreyphillips/rbitcoin, on rbitcoin-v* tags there, for the
# beignet-rbitcoin app. Those images stay where they are: installs of that
# app pull them by digest.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/coreyphillips/rbitcoin-umbrel

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      rbitcoin: ${{ steps.meta.outputs.rbitcoin }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          # The Dockerfile is the one place the rbitcoin version, the commit
          # it is built from, the binary's checksums and the base images are
          # pinned; read them from there so the tag cannot claim a version
          # the binary is not.
          RB=$(sed -nE 's/^ARG RBITCOIN_VERSION=(.+)$/\1/p' docker/Dockerfile)
          COMMIT=$(sed -nE 's/^ARG RBITCOIN_COMMIT=([0-9a-f]{40})$/\1/p' docker/Dockerfile)
          SHA_AMD64=$(sed -nE 's/^ARG RBITCOIN_NODE_SHA256_AMD64=([0-9a-f]{64})$/\1/p' docker/Dockerfile)
          SHA_ARM64=$(sed -nE 's/^ARG RBITCOIN_NODE_SHA256_ARM64=([0-9a-f]{64})$/\1/p' docker/Dockerfile)
          RUST=$(sed -nE 's/^ARG RUST_IMAGE=(.+)$/\1/p' docker/Dockerfile)
          ALPINE=$(sed -nE 's/^ARG ALPINE_IMAGE=(.+)$/\1/p' docker/Dockerfile)
          if [ -z "$RB" ] || [ -z "$COMMIT" ] || [ -z "$SHA_AMD64" ] || [ -z "$SHA_ARM64" ]; then
            echo "::error::docker/Dockerfile must pin RBITCOIN_VERSION, a 40-hex RBITCOIN_COMMIT and a 64-hex RBITCOIN_NODE_SHA256_AMD64 and RBITCOIN_NODE_SHA256_ARM64"; exit 1
          fi
          case "$RUST" in
            rust:*@sha256:*) ;;
            *) echo "::error::docker/Dockerfile must pin RUST_IMAGE to a tag and digest, got '$RUST'"; exit 1 ;;
          esac
          case "$ALPINE" in
            alpine:*@sha256:*) ;;
            *) echo "::error::docker/Dockerfile must pin ALPINE_IMAGE to a tag and digest, got '$ALPINE'"; exit 1 ;;
          esac
          # The tag must be exactly the pinned release plus a numeric app
          # patch: v0.9.0 or v0.9.0-beta would publish a version the
          # release-notes check later refuses, and :latest with it.
          if [ "$VERSION" != "dev" ] && ! printf '%s\n' "$VERSION" | grep -qE "^$(printf '%s' "$RB" | sed 's/\./\\./g')-[0-9]+$"; then
            echo "::error::tag $GITHUB_REF_NAME must be v$RB-<app patch>, the release the Dockerfile pins plus a number (for example v$RB-1); got $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rbitcoin=$RB" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repository on GHCR, so the
      # package shows up under it and takes its access permissions. Whether
      # the first publish comes out public is up to GHCR; check-release's
      # anonymous digest fetch says if it did not (README.md, Releasing).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/coreyphillips/rbitcoin-umbrel
            org.opencontainers.image.description=rbitcoin ${{ needs.meta.outputs.rbitcoin }} (rbitcoin-org/rbitcoin@${{ needs.meta.outputs.commit }}) for the rbitcoin-node Umbrel app
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name both platforms in one index
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RB: ${{ needs.meta.outputs.rbitcoin }}
          COMMIT: ${{ needs.meta.outputs.commit }}
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected a digest from each of the two platforms, got: $(ls)"; exit 1; }
          tags=(-t "$IMAGE:$VERSION")
          [ "$VERSION" = dev ] || tags+=(-t "$IMAGE:latest")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/coreyphillips/rbitcoin-umbrel" \
            --annotation "index:org.opencontainers.image.description=rbitcoin $RB (rbitcoin-org/rbitcoin@$COMMIT) for the rbitcoin-node Umbrel app" \
            --annotation "index:org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            "${sources[@]}"

      - name: Show the published index
        run: docker buildx imagetools inspect "$IMAGE:${{ needs.meta.outputs.version }}"
