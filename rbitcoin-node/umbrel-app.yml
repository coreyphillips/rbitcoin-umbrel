manifestVersion: 1.1
id: rbitcoin-node
name: rbitcoin
tagline: A Rust Bitcoin full node that serves Electrum to your wallets
icon: https://raw.githubusercontent.com/coreyphillips/rbitcoin-umbrel/main/rbitcoin-node/icon.svg
category: bitcoin
version: "0.9.99-2"
port: 2114
description: >-
  rbitcoin is a Bitcoin full node written in Rust that downloads and validates
  the chain itself and serves the Electrum protocol from the same process. It
  needs no Bitcoin Core and no separate indexer. Install it to give your
  Electrum wallets, on this Umbrel (Beignet among them) and on your home
  network, a server that runs on your own Umbrel.


  Read this before installing. rbitcoin is young software. Upstream calls
  mainnet the network to run, plans signed releases and a support window for
  1.0, and lists production multi-tenant Electrum service as a non-goal. Use
  it for your own wallets on this Umbrel and your LAN. It checks scripts and
  signatures in every block after 966143, the block Bitcoin Core 32.1 assumes
  valid (the upstream default milestone); blocks up to it are checked by
  header chain, transaction structure, spends and fees.


  Requirements. An x86_64 Umbrel such as Umbrel Home, or an arm64 one such as
  a Raspberry Pi. Memory matters more than the processor: upstream sizes
  following the chain tip at 16 GiB of RAM, so on a Raspberry Pi the first
  sync is limited by the disk and takes much longer; give it an SSD. About
  750 GiB of free disk for the full store, around 200 GiB of it hot. The first
  sync takes a day or more. The node's data is excluded from Umbrel backups: it
  is hundreds of GiB and can always be rebuilt from the network.


  Before 1.0 the on-disk format can change. When an update needs a fresh sync
  the release notes say so, and you wipe the data and let it download again.


  The dashboard shows sync progress, block history, network traffic, peer
  connections, mempool capacity, uptime, and memory. Save peer limits, mempool
  capacity, and logging defaults in Settings, then restart the app to apply
  them. Light and dark themes and refresh preferences are saved in your browser.


  Connect using the addresses shown in the dashboard:
  rbitcoin-node_node_1:50001 from apps on this Umbrel (Beignet has a
  one-click preset), and umbrel.local:50011 from the rest of your home network.
  Connections are plain TCP without TLS, meant for your own network only.
developer: Brandon Black (rbitcoin), packaged by Corey Phillips
website: https://github.com/rbitcoin-org/rbitcoin
submitter: Corey Phillips
submission: https://github.com/coreyphillips/rbitcoin-umbrel
repo: https://github.com/coreyphillips/rbitcoin-umbrel
support: https://github.com/coreyphillips/rbitcoin-umbrel/issues
gallery:
  - https://raw.githubusercontent.com/coreyphillips/rbitcoin-umbrel/main/rbitcoin-node/gallery/1.png
  - https://raw.githubusercontent.com/coreyphillips/rbitcoin-umbrel/main/rbitcoin-node/gallery/2.png
releaseNotes: >-
  rbitcoin 0.9.99 now runs on arm64 Umbrels, such as a Raspberry Pi, as well
  as x86_64 ones. Until this update the app installed on arm64 but its node
  did not run; now it starts its first sync. Upstream sizes following the
  chain tip at 16 GiB of RAM, so on a Raspberry Pi the first sync is limited
  by the disk and takes much longer.


  On x86_64 the node is the same build as 0.9.99-1, byte for byte. Nothing
  changes there, and no fresh sync or data wipe is needed on either.
dependencies: []
backupIgnore:
  - data
optimizedForUmbrelHome: true
path: ""
defaultUsername: ""
defaultPassword: ""
